name: deploy to s3, cloudfront
# 이벤트정의(트리거)
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # uses: 재사용이 가능한 사전에 만들어진 작업절차
      - uses: actions/checkout@v2

      - name: setup nodejs
        uses: actions/setup-node@v2
        with:
          node-version: '24'

      # run은 개발자가 직접 작업을 정의
      - name: npm install
        working-directory: .
        run: npm install

      - name: npm build
        working-directory: .
        env:
          VITE_APP_NAME: Workforce
          VITE_APP_ENV: production
          VITE_API_BASE_URL: https://server.workforcehr.shop
          VITE_ENABLE_MSW: false
          VITE_LOG_LEVEL: info
          VITE_SENTRY_DSN: ""
        run: npm run build

      - name: setup aws cli
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_KEY}}
          aws-region: "ap-northeast-2"

      - name: deploy to s3
        run: aws s3 sync ./dist s3://www.workforcehr.shop/ --delete

      - name: configure s3 spa fallback
        run: aws s3 website s3://www.workforcehr.shop/ --index-document index.html --error-document index.html

      - name: configure cloudfront spa fallback
        env:
          DISTRIBUTION_ID: E1BIET0ZMCE9IC
        run: |
          aws cloudfront get-distribution-config --id "$DISTRIBUTION_ID" > cloudfront-config.json
          ETAG=$(jq -r '.ETag' cloudfront-config.json)
          jq '
            .DistributionConfig
            | .CustomErrorResponses = {
                Quantity: 2,
                Items: [
                  {
                    ErrorCode: 403,
                    ResponsePagePath: "/index.html",
                    ResponseCode: "200",
                    ErrorCachingMinTTL: 0
                  },
                  {
                    ErrorCode: 404,
                    ResponsePagePath: "/index.html",
                    ResponseCode: "200",
                    ErrorCachingMinTTL: 0
                  }
                ]
              }
          ' cloudfront-config.json > distribution-config.json
          aws cloudfront update-distribution \
            --id "$DISTRIBUTION_ID" \
            --if-match "$ETAG" \
            --distribution-config file://distribution-config.json

      - name: invalidate cloudfront
        run: aws cloudfront create-invalidation --distribution-id E1BIET0ZMCE9IC --paths "/*"