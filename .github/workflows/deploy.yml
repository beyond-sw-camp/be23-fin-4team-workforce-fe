name: deploy to s3, cloudfront
# 이벤트정의(트리거)
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # uses: 재사용이 가능한 사전에 만들어진 작업절차
      - uses: actions/checkout@v2

      - name: setup nodejs
        uses: actions/setup-node@v2
        with:
          node-version: '24'

      # run은 개발자가 직접 작업을 정의
      - name: npm install
        working-directory: .
        run: npm install

      - name: npm build
        working-directory: .
        env:
          VITE_APP_NAME: Workforce
          VITE_APP_ENV: production
          VITE_API_BASE_URL: https://server.workforcehr.shop
          VITE_ENABLE_MSW: false
          VITE_LOG_LEVEL: info
          VITE_SENTRY_DSN: ""
        run: npm run build

      - name: setup aws cli
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_KEY}}
          aws-region: "ap-northeast-2"

      - name: deploy to s3
        run: aws s3 cp ./dist s3://www.workforcehr.shop/ --recursive

      - name: invalidate cloudfront
        run: aws cloudfront create-invalidation --distribution-id E1BIET0ZMCE9IC --paths "/*"